# Example: Qwen via DashScope OpenAI-compatible API
# Start with:
#   deepseek-cursor-proxy --config examples/qwen-config.yaml --no-ngrok

base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
model: qwen-max
api_key: sk-your-dashscope-key-here

# DeepSeek-specific thinking/reasoning fields are not used by Qwen.
thinking: disabled

host: 127.0.0.1
port: 9000
ngrok: false
verbose: false
