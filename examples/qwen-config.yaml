# Example: Qwen via DashScope OpenAI-compatible API
# Start with:
#   set UPSTREAM_API_KEY=sk-your-dashscope-key
#   deepseek-cursor-proxy --config examples/qwen-config.yaml --no-ngrok
#
# API key is read from UPSTREAM_API_KEY (or DEEPSEEK_API_KEY) — not from this file.
# Do not commit real keys here.

base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
model: qwen3.8-flash

# DeepSeek-specific thinking/reasoning fields are not used by Qwen.
thinking: disabled

host: 127.0.0.1
port: 9000
ngrok: false
verbose: false
